[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hla-pipeline-manager"
version = "2.0.0"
description = "Plan, verify and deploy SNP2HLA imputation batches."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ugur Tuna"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# legacy/ holds the original shell scripts, kept as published for reference.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
